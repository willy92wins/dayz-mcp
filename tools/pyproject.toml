[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dayz-mcp-tools"
version = "0.0.0"
requires-python = ">=3.11"
# Kept in lockstep with requirements-mcp.txt, which is what install-mcp.ps1
# provisions the venv from. tests/test_packaging_declarations.py gates the pair.
dependencies = [
    "mcp==1.27.2",
    "Pillow==12.2.0",
    "psutil==7.2.2",
]

[tool.setuptools]
packages = ["dayz_mcp"]
py-modules = ["mcp_capture"]
