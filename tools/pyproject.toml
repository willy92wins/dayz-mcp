[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dayz-mcp-tools"
version = "1.6"
requires-python = ">=3.11"
# Kept in lockstep with requirements-mcp.txt, which is what install-mcp.ps1
# provisions the venv from. tests/test_packaging_declarations.py gates the pair.
dependencies = [
    "mcp==1.27.2",
    "Pillow==12.2.0",
    "psutil==7.2.2",
    "pywin32==312; sys_platform == \"win32\"",
]

[project.scripts]
dayz-mcp = "dayz_mcp.entry:main"

[tool.setuptools]
packages = ["dayz_mcp"]
py-modules = ["mcp_capture", "install_mcp", "p0s_gate"]

[tool.setuptools.package-data]
dayz_mcp = ["playbooks/*.toml", "playbooks/*.py", "playbooks/*.md", "playbooks/fixtures/*/*.json", "VERSION.json"]

[tool.setuptools.data-files]
"Lib/site-packages" = ["mcp-grab.ps1"]
