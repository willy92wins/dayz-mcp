# TEMPORARY diagnostic for the wall-clock flake family (removed before merge).
# Runs each shard of the suite like tests.yml while sampling per-process CPU,
# OS scheduling delay (outside the test process) and in-process delay, with
# Defender as the image ships it and with Defender exclusions for the
# workspace, runner.temp and the Python toolcache.
name: diag-runner-load

on:
  push:
    branches: [fix/ci-wallclock-common-cause]
    paths: [".github/diag/**", ".github/workflows/diag-runner-load.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag shard ${{ matrix.shard }}/4 py${{ matrix.python }} av=${{ matrix.av }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        shard: [1, 2, 3, 4]
        av: [default, excluded]
    defaults:
      run:
        shell: pwsh
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/requirements-mcp.txt

      - name: Defender status
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,BehaviorMonitorEnabled,OnAccessProtectionEnabled,IoavProtectionEnabled,AMRunningMode | Format-List
          (Get-MpPreference).ExclusionPath
          (Get-CimInstance Win32_Processor | Measure-Object NumberOfLogicalProcessors -Sum).Sum

      - name: Defender exclusions
        if: matrix.av == 'excluded'
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}","${{ runner.temp }}","${{ runner.tool_cache }}"
          Add-MpPreference -ExclusionProcess "python.exe"
          (Get-MpPreference).ExclusionPath

      - name: Install
        run: |
          python -m venv .venv-mcp
          .\.venv-mcp\Scripts\python.exe -m pip install pip==26.2.1
          .\.venv-mcp\Scripts\python.exe -m pip install -r requirements-mcp.txt
          .\.venv-mcp\Scripts\python.exe -m pip install -e .
          python -m pip install psutil

      - name: Run shard with sampling
        continue-on-error: true
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          DAYZ_MCP_FOREIGN_TOOLCHAIN: "1"
        run: |
          $out = "${{ runner.temp }}\diag-out"
          $stop = "${{ runner.temp }}\diag-stop"
          New-Item -ItemType Directory -Force $out | Out-Null
          $sampler = Start-Process -PassThru -NoNewWindow python -ArgumentList "..\.github\diag\sampler.py", $out, $stop
          $probe = Start-Process -PassThru -NoNewWindow python -ArgumentList "..\.github\diag\sampler.py", $out, $stop, "probe"
          # psutil's first process walk takes seconds; start the suite after it.
          $deadline = (Get-Date).AddSeconds(60)
          while (-not ((Test-Path "$out\procs.jsonl") -and (Get-Item "$out\procs.jsonl").Length -gt 0) -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          .\.venv-mcp\Scripts\python.exe -B ..\.github\diag\diag_run.py "${{ matrix.shard }}/4" $out
          $code = $LASTEXITCODE
          Start-Sleep 5
          New-Item -ItemType File $stop | Out-Null
          $sampler.WaitForExit(15000) | Out-Null
          $probe.WaitForExit(15000) | Out-Null
          "suite exit: $code"
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.python }}-${{ matrix.shard }}-${{ matrix.av }}
          path: ${{ runner.temp }}/diag-out
